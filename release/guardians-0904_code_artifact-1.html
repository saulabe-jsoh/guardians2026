<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가디언즈(Guardians) 프로그램 아키텍처 다이어그램 캔버스</title>
    <style>
        :root {
            --bg-deep: #080e1e;
            --bg-card: #111c33;
            --border: #233554;
            --accent-cyan: #38bdf8;
            --accent-green: #34d399;
            --accent-yellow: #fbbf24;
            --accent-purple: #c084fc;
            --accent-red: #f87171;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-box {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
        }

        .title-box h1 {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .title-box p {
            font-size: 12px;
            color: var(--text-sub);
        }

        .nav-switch {
            display: flex;
            background: #0b1329;
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
            gap: 6px;
        }

        .switch-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .switch-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .switch-btn.active {
            background: var(--accent-cyan);
            color: #041226;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1.25fr 0.75fr;
            gap: 20px;
            padding: 20px 24px;
            max-width: 1750px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 1100px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .canvas-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .canvas-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .canvas-title-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-mode {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .canvas-viewport {
            position: relative;
            flex: 1;
            min-height: 560px;
            background: #060a14;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .canvas-notice {
            position: absolute;
            bottom: 12px;
            right: 14px;
            font-size: 11px;
            color: rgba(148, 163, 184, 0.7);
            pointer-events: none;
        }

        .info-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            overflow-y: auto;
            max-height: calc(100vh - 105px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .info-panel h2 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .info-panel .subtitle {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 20px;
            line-height: 1.5;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .spec-box {
            margin-bottom: 18px;
            background: rgba(15, 23, 42, 0.6);
            padding: 14px 16px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-cyan);
        }

        .spec-box.green { border-left-color: var(--accent-green); }
        .spec-box.purple { border-left-color: var(--accent-purple); }
        .spec-box.yellow { border-left-color: var(--accent-yellow); }
        .spec-box.red { border-left-color: var(--accent-red); }

        .spec-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .spec-desc {
            font-size: 12.5px;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .summary-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 8px;
        }

        .summary-table th, .summary-table td {
            padding: 7px 10px;
            border: 1px solid var(--border);
            text-align: left;
        }

        .summary-table th {
            background: rgba(255, 255, 255, 0.04);
            color: var(--accent-cyan);
            font-weight: 600;
        }

        #graphTooltip {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            max-width: 250px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-brand">
            <div class="logo-box">🛡️</div>
            <div class="title-box">
                <h1>가디언즈(Guardians) 프로그램 아키텍처 다이어그램</h1>
                <p>경찰 내부망 전용 2단계 비식별화 및 초경량 온디바이스 음절 임베딩 파이프라인</p>
            </div>
        </div>
        <div class="nav-switch">
            <button id="btnDiagram1" class="switch-btn active" onclick="switchDiagram(1)">
                <span>🔒</span> 1. 비식별화 모듈 구조도
            </button>
            <button id="btnDiagram2" class="switch-btn" onclick="switchDiagram(2)">
                <span>🔄</span> 2. 비식별화 파이프라인
            </button>
            <button id="btnDiagram3" class="switch-btn" onclick="switchDiagram(3)">
                <span>⚡</span> 3. 음절 모델 모듈 구조도
            </button>
            <button id="btnDiagram4" class="switch-btn" onclick="switchDiagram(4)">
                <span>🚀</span> 4. 실시간 추론 파이프라인
            </button>
        </div>
    </header>

    <main>
        <div class="canvas-container">
            <div class="canvas-toolbar">
                <div class="canvas-title-area">
                    <span id="diagIcon">🔒</span>
                    <h3 id="diagTitle" style="font-size:15px; font-weight:700;">하이브리드 비식별화 서브시스템 구조도</h3>
                </div>
                <span class="badge-mode" id="diagTag">경찰 내부망 폐쇄환경</span>
            </div>
            <div class="canvas-viewport">
                <canvas id="architectureCanvas"></canvas>
                <div class="canvas-notice">💡 각 모듈 노드에 마우스를 올려 내부 입출력 구조를 확인하세요.</div>
                <div id="graphTooltip"></div>
            </div>
        </div>

        <div class="info-panel" id="panelContent">
            <!-- 동적 해설 패널 -->
        </div>
    </main>

    <script>
        let activeDiagram = 1;
        const canvas = document.getElementById('architectureCanvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('graphTooltip');

        let nodes = [];
        let links = [];
        let hoveredNode = null;
        let particles = [];
        let animId = null;

        function resizeCanvas() {
            const wrapper = canvas.parentElement;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = wrapper.clientWidth * dpr;
            canvas.height = wrapper.clientHeight * dpr;
            ctx.scale(dpr, dpr);
            drawScene();
        }
        window.addEventListener('resize', resizeCanvas);

        function drawScene() {
            const width = canvas.parentElement.clientWidth;
            const height = canvas.parentElement.clientHeight;

            ctx.clearRect(0, 0, width, height);

            // 반응형 노드 픽셀 좌표 자동 환산 (경계선 안쪽 패딩 적용으로 짤림 방지)
            nodes.forEach(node => {
                node.x = width * node.rx - node.w / 2;
                node.y = height * node.ry - node.h / 2;

                if (node.x < 14) node.x = 14;
                if (node.x + node.w > width - 14) node.x = width - node.w - 14;
                if (node.y < 14) node.y = 14;
                if (node.y + node.h > height - 14) node.y = height - node.h - 14;
            });

            // 배경 기술적 그리드 렌더링
            ctx.strokeStyle = "rgba(255, 255, 255, 0.025)";
            ctx.lineWidth = 1;
            for (let x = 0; x < width; x += 32) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += 32) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            // 연결 링크 렌더링
            links.forEach(link => {
                const src = nodes.find(n => n.id === link.from);
                const dst = nodes.find(n => n.id === link.to);
                if (!src || !dst) return;

                const sx = src.x + src.w / 2;
                const sy = src.y + src.h / 2;
                const dx = dst.x + dst.w / 2;
                const dy = dst.y + dst.h / 2;

                ctx.beginPath();
                ctx.strokeStyle = "rgba(148, 163, 184, 0.3)";
                ctx.lineWidth = 2;
                ctx.moveTo(sx, sy);
                ctx.lineTo(dx, dy);
                ctx.stroke();

                if (link.label) {
                    const mx = (sx + dx) / 2;
                    const my = (sy + dy) / 2;
                    ctx.font = "11px Pretendard, sans-serif";
                    ctx.fillStyle = "rgba(148, 163, 184, 0.8)";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "bottom";
                    ctx.fillText(link.label, mx, my - 4);
                }
            });

            // 데이터 플로우 입자(Particle) 렌더링
            particles.forEach(p => {
                const src = nodes.find(n => n.id === p.link.from);
                const dst = nodes.find(n => n.id === p.link.to);
                if (!src || !dst) return;

                const sx = src.x + src.w / 2;
                const sy = src.y + src.h / 2;
                const dx = dst.x + dst.w / 2;
                const dy = dst.y + dst.h / 2;

                const cx = sx + (dx - sx) * p.progress;
                const cy = sy + (dy - sy) * p.progress;

                ctx.beginPath();
                ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
                ctx.fillStyle = src.color || "#38bdf8";
                ctx.shadowColor = src.color || "#38bdf8";
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.shadowBlur = 0;

                p.progress += p.speed;
                if (p.progress > 1) p.progress = 0;
            });

            // 모듈 노드 카드 렌더링
            nodes.forEach(node => {
                const isHover = (hoveredNode === node);

                ctx.shadowColor = isHover ? node.color : "rgba(0, 0, 0, 0.5)";
                ctx.shadowBlur = isHover ? 18 : 8;

                ctx.fillStyle = isHover ? "#1e2b45" : "#131f38";
                ctx.beginPath();
                ctx.roundRect(node.x, node.y, node.w, node.h, 10);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.strokeStyle = isHover ? node.color : "rgba(255, 255, 255, 0.12)";
                ctx.lineWidth = isHover ? 2 : 1;
                ctx.stroke();

                // 포인트 컬러 라인
                ctx.fillStyle = node.color;
                ctx.beginPath();
                ctx.roundRect(node.x, node.y, 5, node.h, [10, 0, 0, 10]);
                ctx.fill();

                // 타이틀
                ctx.fillStyle = isHover ? "#ffffff" : "#f8fafc";
                ctx.font = "bold 13px Pretendard, sans-serif";
                ctx.textAlign = "left";
                ctx.textBaseline = "top";
                ctx.fillText(node.title, node.x + 14, node.y + 13);

                // 서브텍스트
                ctx.fillStyle = isHover ? "#cbd5e1" : "#94a3b8";
                ctx.font = "11px Pretendard, sans-serif";
                ctx.fillText(node.sub, node.x + 14, node.y + 36);
            });
        }

        function runLoop() {
            drawScene();
            animId = requestAnimationFrame(runLoop);
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            let hit = null;
            for (let node of nodes) {
                if (mx >= node.x && mx <= node.x + node.w &&
                    my >= node.y && my <= node.y + node.h) {
                    hit = node;
                    break;
                }
            }

            hoveredNode = hit;
            if (hit) {
                canvas.style.cursor = 'pointer';
                tooltip.style.opacity = '1';
                tooltip.style.left = `${e.clientX + 14}px`;
                tooltip.style.top = `${e.clientY + 14}px`;
                tooltip.innerHTML = `<b>${hit.title}</b><br><span style="color:#94a3b8;">${hit.sub}</span>`;
            } else {
                canvas.style.cursor = 'default';
                tooltip.style.opacity = '0';
            }
        });

        canvas.addEventListener('mouseleave', () => {
            hoveredNode = null;
            tooltip.style.opacity = '0';
        });

            let html = `
                <h2>${data.title}</h2>
                <div class="subtitle">${data.subtitle}</div>
            `;

            data.specs.forEach(s => {
                html += `
                    <div class="spec-box ${s.color}">
                        <div class="spec-title">${s.title}</div>
                        <div class="spec-desc">${s.desc}</div>
                    </div>
                `;
            });

            html += `
                <div style="margin-top: 18px;">
                    <div class="spec-title" style="margin-bottom: 8px;">📋 세부 모듈 및 파이프라인 사양표</div>
                    <table class="summary-table">
                        <thead>
                            <tr>
                                <th>${data.table[0][0]}</th>
                                <th>${data.table[0][1]}</th>
                                <th>${data.table[0][2]}</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            for (let i = 1; i < data.table.length; i++) {
                html += `
                    <tr>
                        <td><b>${data.table[i][0]}</b></td>
                        <td>${data.table[i][1]}</td>
                        <td>${data.table[i][2]}</td>
                    </tr>
                `;
            }

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        }

        window.onload = () => {
            switchDiagram(1);
            resizeCanvas();
            runLoop();
        };
    </script>
</body>
</html>
